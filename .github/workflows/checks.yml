name: DayEnd checks
on:
  push:
    branches:
      - main
      - upgrade/dayend-v4-ui-validation
      - upgrade/dayend-v4.1-clean-ui
      - upgrade/dayend-v4.2-reference-ui-fast-import
      - upgrade/dayend-v4.3-fullscreen-hero
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check dayend-core.js
          node --check dayend-app.js
          node --check excel-unpack-worker.js
          node --check sw.js
      - name: Run regression tests
        run: node --test tests/*.test.js

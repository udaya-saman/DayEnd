<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#C92026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAY END">
<title>DAY END | Outlet reports</title>
<link rel="manifest" href="./manifest.json?v=4.4.0">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=4.4.0">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=4.4.0">
<style>

:root{--red:#c70716;--red-dark:#90000c;--red-soft:#fff0f2;--ink:#191b25;--muted:#697282;--line:#e4e6ed;--white:#fff;--focus:#ffce6c;--success:#137c45;--shadow:0 12px 33px rgba(45,37,55,.09);--radius:22px;--wave-height:clamp(62px,11dvh,112px)}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:clamp(108px,18.5dvh,170px) minmax(0,1fr);background:#f5f6f9;color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button,input,select{font:inherit}button{cursor:pointer}
button:disabled{opacity:.52;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.shell{width:min(100%,800px);margin-inline:auto}
.top{height:100%;color:#fff;background:linear-gradient(130deg,#950009 0%,#b40011 48%,#84000a 100%);box-shadow:0 4px 18px #7d000919}
.top-inner{height:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:clamp(16px,3.2dvh,30px) 21px 15px}
.brand{display:flex;align-items:center;min-width:0}
.hero-wordmark{display:block;width:clamp(128px,25vw,182px);height:auto;aspect-ratio:300/136;object-fit:contain;object-position:left center;filter:drop-shadow(0 1px 1px #38000a20)}
.top-tools{display:flex;align-items:center;gap:7px;max-width:55%}
.outlet-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:41px;max-width:100%;padding:8px 11px 8px 15px;border:1px solid #ffffff80;border-radius:999px;background:#a80a1933;color:white;font-size:13px;font-weight:750;white-space:nowrap}
.outlet-button:hover:not(:disabled),.settings-gear:hover:not(:disabled){background:#ffffff19}
.outlet-button span:first-child{overflow:hidden;text-overflow:ellipsis}
.outlet-button svg{width:16px;height:16px;flex:none}
.settings-gear{display:grid;place-items:center;flex:none;width:40px;height:40px;border:0;background:transparent;color:white;border-radius:11px}
.settings-gear svg{width:22px;height:22px}
main{position:relative;display:flex;flex-direction:column;min-height:0;height:calc(100% + 32px);margin-top:-32px;border-radius:27px 27px 0 0;padding:clamp(22px,5.5dvh,52px) clamp(12px,3vw,26px) calc(var(--wave-height) + clamp(8px,1.4dvh,16px));background:linear-gradient(172deg,#fdfdfe 0%,#f9fafc 55%,#fff 100%);overflow:hidden;isolation:isolate}
main::after{content:"";position:absolute;inset:auto 0 0;height:100%;background:none;pointer-events:none}
main::before{content:"";display:none}
.footer-waves{position:absolute;z-index:0;pointer-events:none;bottom:0;left:0;width:100%;height:var(--wave-height);overflow:visible}
#uploadScreen,#resultScreen{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;height:100%;width:100%}
#uploadScreen .panel{margin-top:clamp(4px,3dvh,29px)}
.panel{position:relative;min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:#fff;border:1px solid #e5e8ef;border-radius:22px;padding:clamp(15px,2.9dvh,25px);box-shadow:var(--shadow)}
.panel-heading{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:clamp(12px,2.6dvh,22px)}
h1,h2,p{margin:0}
h1{font-size:clamp(18px,3.25vw,23px);font-weight:850;letter-spacing:-.025em}
.mini{font-size:11px;color:var(--muted);font-weight:700}
.title-file-icon{display:inline-grid;place-items:center;width:23px;height:27px;vertical-align:-2px;margin-right:8px;border:2px solid var(--red);border-radius:4px;color:var(--red);font-size:17px;font-weight:800;line-height:1}
.upload-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,2vw,16px)}
.upload-card{position:relative;min-width:0;min-height:clamp(136px,28dvh,220px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(5px,1dvh,10px);padding:10px 7px;border:1.6px dashed #aeb6c7;border-radius:14px;background:#fefefe;transition:border-color .15s,background .15s;cursor:pointer}
.upload-card:hover,.upload-card.drag,.upload-card:focus-within{border-color:var(--red);background:var(--red-soft)}
.upload-card.ready{border-color:#8aca9d;background:#f8fef9}
.upload-card input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1}
.upload-icon{display:grid;place-items:center;width:clamp(39px,7.5dvh,55px);height:clamp(39px,7.5dvh,55px);border-radius:12px;background:#fff4f5;color:var(--red)}
.upload-icon svg{width:75%;height:75%;stroke:currentColor}
.upload-label{font-size:clamp(13px,1.8vw,16px);font-weight:850;letter-spacing:-.02em}
.upload-hint{color:var(--muted);font-size:clamp(10px,1.5vw,12px)}
.file-name{max-width:100%;border-radius:9px;padding:5px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#eefaec;color:var(--success);font-weight:750;font-size:11px}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:clamp(11px,2dvh,22px)}
.btn{min-height:44px;padding:9px 17px;border:1px solid transparent;border-radius:12px;font-size:14px;font-weight:800;transition:background .14s,transform .14s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#e10b1a,#a40011);box-shadow:0 5px 14px #c70b1b25;color:#fff}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#c90617,#8e0010)}
.btn.secondary{background:#fff;color:var(--ink);border-color:#c7cbd6}
.btn.secondary:hover:not(:disabled){background:#f7f8fa}
.btn.full{flex:1;min-width:160px}
#showReport{font-size:clamp(15px,2vw,17px);min-height:clamp(43px,7dvh,54px)}
#clearFiles{font-size:12px}
.note{margin:clamp(8px,1.5dvh,14px) 5px 0;text-align:center;color:var(--muted);font-size:10px}
.notice{margin-top:12px;border-radius:11px;border:1px solid;padding:9px 12px;font-size:12px}
.notice strong{display:block;margin-bottom:3px}.notice ul{margin:0;padding-left:17px}
.notice.error{background:#fff4f4;color:#9c2026;border-color:#efc0c5}
.notice.warning{background:#fff9ea;color:#755319;border-color:#ead293}
.notice.success{background:#effbf4;color:#136d45;border-color:#cae7d4}
.field-label{display:block;font-weight:900;font-size:clamp(16px,2.5vw,20px);margin-bottom:clamp(6px,1.2dvh,11px)}
select{display:block;width:100%;height:clamp(43px,6.2dvh,53px);padding:0 44px 0 14px;border:1.5px solid var(--red);border-radius:11px;background:#fff8f9;color:var(--ink);font-size:16px;font-weight:700}
select:focus-visible{border-color:#f52534}
.metric-navigation{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(8px,2vw,15px);padding:clamp(10px,1.9dvh,20px) 0}
.metric-navigation .btn{width:100%;min-height:clamp(40px,6.3dvh,51px);padding:7px 10px;display:flex;align-items:center;justify-content:center;gap:clamp(7px,1.5vw,12px);font-size:clamp(14px,2vw,16px);font-weight:850}
.metric-navigation .nav-arrow{display:grid;place-items:center;flex:none;width:clamp(22px,3.1dvh,28px);height:clamp(22px,3.1dvh,28px);border-radius:50%;background:#f1f2f6;color:#3b424c}
.metric-navigation .primary .nav-arrow{background:#ffffff2f;color:white}
.metric-navigation .nav-arrow svg{width:16px;height:16px;stroke-width:2.6}
.metric-position{font-variant-numeric:tabular-nums;font-size:clamp(11px,1.7vw,13px);color:#444b57;font-weight:800;white-space:nowrap}
.table-wrap{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.data-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.data-table th{background:#f1f3f7;text-align:left;padding:clamp(7px,1.3dvh,13px) 15px;font-size:12px;font-weight:850}
.data-table th:last-child,.data-table td:last-child{text-align:right}
.data-table td{padding:clamp(7px,1.45dvh,13px) 15px;border-top:1px solid #e5e8ef;font-size:clamp(13px,1.85vw,16px)}
.data-table tbody tr:first-child td{border-top:0}.data-table td:last-child{font-weight:800}
.data-table tr.total{background:#ffe7ea}.data-table tr.total td{color:#a40012;font-weight:900;border-top:2px solid #f3c9ce}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:clamp(10px,2dvh,22px)}
.result-actions .btn{width:100%;font-size:clamp(12px,1.65vw,14px)}
.result-actions #newReports{border-color:#f1b4ba;background:#fff0f2;color:#a50010}
.credit{position:relative;z-index:1;flex:none;text-align:center;margin:auto 0 0;padding-top:clamp(7px,1.4dvh,16px);font-size:clamp(10px,1.45vw,12px);font-weight:600;color:#363b44;line-height:1.3}
.dialog-wrap{position:fixed;inset:0;background:#151728a8;display:grid;place-items:center;z-index:30;padding:20px}
.dialog{width:min(100%,440px);background:#fff;border-radius:19px;padding:24px;box-shadow:0 20px 65px #0003}
.dialog h2{font-size:22px;margin:0 0 7px}.dialog p{font-size:13px;color:var(--muted);margin-bottom:15px}
.dialog .field-label{font-size:14px}.dialog .hint{font-size:12px;color:var(--muted);margin-top:7px}
@media(max-width:620px){
.top-inner{padding:clamp(12px,2.5dvh,24px) 12px}
.hero-wordmark{width:clamp(122px,39vw,170px)}
.top-tools{gap:2px;max-width:59%}
.outlet-button{font-size:clamp(11px,2.7vw,13px);min-height:37px;padding:7px 9px}
.settings-gear{width:35px;height:37px}.settings-gear svg{width:20px;height:20px}
main{margin-top:-28px;height:calc(100% + 28px);border-radius:23px 23px 0 0;padding:clamp(18px,3.5dvh,28px) 12px calc(var(--wave-height) + 8px)}
.panel{border-radius:19px;padding:clamp(12px,2dvh,18px)}
#uploadScreen .panel{margin-top:clamp(0px,2dvh,18px)}
.panel-heading{margin-bottom:clamp(10px,1.7dvh,17px)}
.mini{display:none}
.upload-grid{gap:8px}
.upload-label{font-size:clamp(12px,3.4vw,14px)}
.upload-hint{font-size:10px}
.upload-card{padding:8px 5px;min-height:clamp(130px,27dvh,190px)}
.file-name{font-size:9px}
.metric-navigation{gap:8px}
.metric-navigation .btn{font-size:clamp(12px,3.6vw,15px);padding:7px 5px;gap:5px}
.metric-navigation .nav-arrow{width:22px;height:22px}
.table-wrap{border-radius:12px}.data-table th,.data-table td{padding-left:10px;padding-right:10px}
.result-actions .btn{padding:7px 6px}
}
@media(max-height:720px){
:root{--wave-height:clamp(46px,9dvh,70px)}
body{grid-template-rows:clamp(90px,16dvh,118px)}
.top-inner{padding-top:12px}
.hero-wordmark{width:125px}
main{padding-top:clamp(12px,2dvh,20px)}
#uploadScreen .panel{margin-top:0}
.upload-card{min-height:clamp(102px,24dvh,145px);gap:3px}
.upload-icon{width:37px;height:37px}
.upload-hint{font-size:10px}
.panel-heading{margin-bottom:8px}
.panel{padding:12px}
.field-label{margin-bottom:5px}
select{height:41px}
.metric-navigation{padding:8px 0}
.metric-navigation .btn{min-height:38px}
.data-table th{padding-top:6px;padding-bottom:6px}
.data-table td{padding-top:5px;padding-bottom:5px}
.result-actions{margin-top:9px}.result-actions .btn{min-height:40px}
.credit{padding-top:5px}
}
@media(max-height:555px){.note{display:none}.upload-card{min-height:92px}.upload-icon{height:28px;width:28px}.upload-hint{display:none}.file-name{padding:3px 6px}.panel-heading{margin-bottom:5px}.metric-navigation .btn{min-height:35px}.credit{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


/* v4.4: sheet-driven outlet and more balanced card proportions */
.top-inner{align-items:center;padding-bottom:clamp(30px,5.2dvh,56px)}
.outlet-display{display:flex;align-items:center;justify-content:center;max-width:52%;min-width:0;min-height:47px;padding:10px 15px;border:1px solid #ffffff45;border-radius:16px;background:#ffffff12;box-shadow:inset 0 1px #ffffff24;color:#fff;text-align:center}
.outlet-display span{display:block;max-width:100%;font-size:19.5px;line-height:1.22;font-weight:850;letter-spacing:.005em;overflow-wrap:anywhere}
#uploadScreen{justify-content:center;padding-bottom:clamp(11px,2.5dvh,26px)}
#uploadScreen .panel{margin-top:0;padding:clamp(22px,3.5dvh,34px) clamp(18px,3.2vw,30px) clamp(28px,4.6dvh,42px)}
#uploadScreen .panel-heading{margin-bottom:clamp(17px,3dvh,29px)}
#uploadScreen .upload-grid{gap:clamp(11px,2.2vw,20px)}
#uploadScreen .upload-card{padding:clamp(14px,2.6dvh,25px) clamp(9px,1.8vw,18px);gap:clamp(7px,1.2dvh,13px)}
#uploadScreen .actions{margin-top:clamp(18px,3dvh,29px)}
#resultScreen{justify-content:center;padding-bottom:clamp(9px,2dvh,19px)}
#resultScreen .panel{padding:clamp(20px,3.1dvh,31px) clamp(18px,3.2vw,30px) clamp(24px,4dvh,36px)}
#resultScreen .metric-navigation{padding-block:clamp(14px,2.4dvh,24px)}
#resultScreen .result-actions{margin-top:clamp(15px,2.4dvh,25px)}
@media(max-width:620px){
 .top-inner{padding-bottom:clamp(28px,4.9dvh,47px)}
 .outlet-display{max-width:53%;min-height:42px;padding:8px 10px;border-radius:12px}
 .outlet-display span{font-size:16.5px}
 #uploadScreen .panel{padding:clamp(18px,2.8dvh,26px) clamp(13px,2.5vw,20px) clamp(23px,3.4dvh,31px)}
 #uploadScreen .upload-card{padding:clamp(11px,1.9dvh,18px) 7px}
 #resultScreen .panel{padding:clamp(15px,2.6dvh,23px) 14px clamp(18px,3dvh,28px)}
}
@media(max-height:720px){
 #uploadScreen .panel{padding:13px 14px 17px}
 #uploadScreen .panel-heading{margin-bottom:9px}
 #uploadScreen .upload-card{padding:8px 5px;gap:4px}
 #uploadScreen .actions{margin-top:11px}
 #resultScreen .panel{padding:12px 14px 15px}
 #resultScreen .metric-navigation{padding-block:9px}
 #resultScreen .result-actions{margin-top:10px}
}

</style>
<script defer src="./vendor/jszip.min.js"></script>
<script defer src="./dayend-core.js?v=4.4.0"></script>
<script defer src="./dayend-app.js?v=4.4.0"></script>
</head>
<body>
<header class="top"><div class="shell top-inner"><div class="brand" aria-label="DAY END"><img class="hero-wordmark" src="./icons/hero-dayend-logo.png?v=4.4.0" width="150" height="68" alt="DAY END"></div><div class="outlet-display" aria-live="polite" aria-atomic="true"><span id="outletName">Awaiting outlet</span></div></div></header>
<main class="shell">
<section id="uploadScreen" aria-labelledby="uploadTitle">
<div class="panel">
<div class="panel-heading"><h1 id="uploadTitle"><span class="title-file-icon" aria-hidden="true">▤</span> Upload Excel Reports</h1><span class="mini">Daily + MTD · .xlsx or .xlsm</span></div>
<div class="upload-grid">
<label class="upload-card" id="dailyCard"><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 35a9.5 9.5 0 0 1-.9-18.8 14 14 0 0 1 26.6 4.2A7.5 7.5 0 0 1 35.5 35H32"/><path d="M24 39V23m0 0-6 6m6-6 6 6"/></svg></span><span class="upload-label">Daily Report</span><span class="upload-hint">Choose the report for one date</span><span class="file-name" id="dailyFile">No file selected</span><input type="file" id="dailyInput" accept=".xlsx,.xlsm" aria-label="Choose Daily Excel report"></label>
<label class="upload-card" id="mtdCard"><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 35a9.5 9.5 0 0 1-.9-18.8 14 14 0 0 1 26.6 4.2A7.5 7.5 0 0 1 35.5 35H32"/><path d="M24 39V23m0 0-6 6m6-6 6 6"/></svg></span><span class="upload-label">MTD Report</span><span class="upload-hint">Choose the month-to-date report</span><span class="file-name" id="mtdFile">No file selected</span><input type="file" id="mtdInput" accept=".xlsx,.xlsm" aria-label="Choose Month-to-Date Excel report"></label>
</div>
<div id="uploadMessages" role="alert" aria-live="polite"></div>
<div class="actions"><button class="btn primary full" type="button" id="showReport" disabled>View Report →</button><button class="btn secondary" type="button" id="clearFiles">Clear Reports</button></div>
</div>
<p class="note">Files are checked on your device and are not uploaded to a server. The app also works offline after installation.</p>
</section>
<section id="resultScreen" aria-label="Report results" hidden>
<div class="panel">
<label class="field-label" for="metric">Report Category</label>
<select id="metric" aria-describedby="metricPosition"></select>
<nav class="metric-navigation" aria-label="Report category navigation">
<button class="btn secondary" id="previousMetric" type="button"><span class="nav-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m13.5 5.5-6.5 6.5 6.5 6.5"/></svg></span><span>Previous</span></button>
<span class="metric-position" id="metricPosition" role="status" aria-live="polite">1 of 7</span>
<button class="btn primary" id="nextMetric" type="button"><span>Next</span><span class="nav-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 5.5 6.5 6.5-6.5 6.5"/></svg></span></button>
</nav>
<div class="table-wrap">
<table class="data-table"><thead><tr><th scope="col">Channel</th><th scope="col">Value (Rs.)</th></tr></thead><tbody id="resultRows"></tbody></table>
</div>
<div id="resultWarnings" aria-live="polite"></div>
<div class="result-actions"><button class="btn secondary" id="backToUpload" type="button">Edit Reports</button><button class="btn secondary" id="newReports" type="button">New Reports</button></div>
</div>
<p class="credit">Designed and developed by Udaya Saman | 071 969 8799</p>
</section>
<svg class="footer-waves" viewBox="0 0 600 112" preserveAspectRatio="none" aria-hidden="true" focusable="false">
 <defs><linearGradient id="waveBack" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fb283a"/><stop offset="1" stop-color="#be0a1d"/></linearGradient><linearGradient id="waveFront" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#df1124"/><stop offset="1" stop-color="#8e0012"/></linearGradient></defs>
 <path fill="url(#waveBack)" d="M0 31 C120 102 275 103 420 51 C505 18 555 14 600 18 L600 112 L0 112 Z"/>
 <path fill="url(#waveFront)" d="M0 54 C135 115 288 112 439 65 C517 39 562 38 600 42 L600 112 L0 112 Z"/>
</svg>
</main>
</body>
</html>

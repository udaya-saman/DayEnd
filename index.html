<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAY END</title>
<meta name="theme-color" content="#EE3124">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAY END">
<style>
:root{--red:#EE3124;--deep:#C90014;--ink:#141414;--mut:#6b6b6b;--bg:#F4F3F1;--line:#E8E6E3}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100svh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.top{background:#141414;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;border-bottom:4px solid var(--red)}
.top b{font-size:1.15rem;letter-spacing:.08em}.top span{font-size:.85rem;color:#d6d6d6}
main{max-width:520px;margin:0 auto;padding:20px 16px}
.pick{text-align:center;padding-top:12vh}.pick.drag .big{outline:3px dashed var(--ink);outline-offset:4px}
.big{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;border-radius:16px;background:var(--red);color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;position:relative}
.big:active{background:var(--deep)}.big:focus-within{outline:3px solid var(--ink);outline-offset:3px}
.big input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.big.busy{background:#8a8a8a;pointer-events:none}
.chips{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}.chips li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;display:flex;justify-content:space-between;gap:10px}.chips li span{color:var(--mut);font-weight:500}
.msg{margin:14px 0 0;background:#fff;border-left:5px solid var(--deep);border-radius:12px;padding:12px 14px;text-align:left;color:var(--deep);font-weight:600;font-size:.95rem}.msg p{margin:0}.msg p+p{margin-top:6px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 2px 16px}.when b{display:block;font-size:1.15rem}.when span{color:var(--mut);font-size:.88rem}
.link{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;font:inherit;font-weight:700;cursor:pointer}.link:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{margin:0 0 6px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--deep)}
.hero{background:#141414;color:#fff;border-top:5px solid var(--red)}.hero h2{color:#fff}
.hero .num{font-size:clamp(2.2rem,11vw,3rem);font-weight:900;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}.hero .cap{color:#cfcfcf;font-size:.82rem;margin-bottom:6px}
dl{margin:0}dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.hero dl div{border-color:#3a3a3a}
dl .tot{border-top:2px solid var(--ink)}dl .tot dt,dl .tot dd{color:var(--deep);font-weight:900}
dt{color:var(--mut);font-size:.95rem}.hero dt{color:#cfcfcf}dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.02rem}
</style>
<script src="vendor/jszip.min.js"></script>
</head>
<body>
<header class="top"><b>DAY END</b><span>Matara 2</span></header>
<main>
  <section class="pick" id="pick">
    <label class="big" id="big"><span id="bigText">Choose Daily + MTD reports</span><input id="files" type="file" multiple accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12" aria-label="Choose the Daily and MTD Excel reports"></label>
    <ul class="chips" id="chips"></ul>
    <div class="msg" id="msg" role="alert" hidden></div>
  </section>
  <section id="out" hidden>
    <div class="bar"><div class="when"><b id="whenDay"></b><span id="whenMtd"></span></div><button class="link" id="reset" type="button">New reports</button></div>
    <div id="cards"></div>
  </section>
</main>
<script>
'use strict';
const VERSION='3.1.0';
const OUTLET_TARGET='matara 2';
const CHANNELS=[{key:'dine',label:'Dine In'},{key:'takeaway',label:'Take Away'},{key:'delivery',label:'Delivery'},{key:'aggregator',label:'Aggregator'},{key:'total',label:'Total'}];
const DISPLAY_ROWS=[{label:'Dine',sourceIndex:0},{label:'T/Away',sourceIndex:1},{label:'Delivery',sourceIndex:2},{label:'Aggregator',sourceIndex:3},{label:'DAY SALE',sourceIndex:4}];
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanText=v=>String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
const normalise=v=>cleanText(v).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function iso(y,m,d){const dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCFullYear()!==y||dt.getUTCMonth()+1!==m||dt.getUTCDate()!==d)return'';return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function excelDateToken(token,role){const m=String(token||'').match(/(\d{1,2})\s*[/.\-]\s*(\d{1,2})\s*[/.\-]\s*(\d{4})/);if(!m)return'';const a=+m[1],b=+m[2],y=+m[3];let day,month;if(a>12){day=a;month=b}else if(b>12){day=b;month=a}else if(role==='from'&&(a===1||b===1)){day=1;month=a===1?b:a}else{day=a;month=b}return iso(y,month,day)}
function parseDateRange(rows){const text=rows.flat().map(cleanText).filter(Boolean).join('\n');const fm=text.match(/From\s*Date\s*[:：]?\s*(\d{1,2}\s*[/.\-]\s*\d{1,2}\s*[/.\-]\s*\d{4})/i);const tm=text.match(/To\s*Date\s*[:：]?\s*(\d{1,2}\s*[/.\-]\s*\d{1,2}\s*[/.\-]\s*\d{4})/i);return{from:fm?excelDateToken(fm[1],'from'):'',to:tm?excelDateToken(tm[1],'to'):''}}
function toNumber(v){if(typeof v==='number')return Number.isFinite(v)?v:NaN;let s=cleanText(v);if(!s||s==='-'||s==='—')return NaN;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}s=s.replace(/(?:LKR|Rs\.?|රු\.?)/gi,'').replace(/[\s,]/g,'');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;const n=Number(s);return Number.isFinite(n)?(neg?-n:n):NaN}
function cents(n){return Math.round((n+Number.EPSILON)*100)}
function money(n){return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function integer(n){return Number.isFinite(n)?Math.round(n).toLocaleString('en-US'):'—'}
function rs(n){return `Rs. ${money(n)}`}
function dateObj(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function dateFormat(s,options={day:'2-digit',month:'short',year:'numeric'}){const d=dateObj(s);return d?d.toLocaleDateString('en-GB',{...options,timeZone:'UTC'}):'Date unavailable'}
function dayCount(a,b){if(!a||!b)return NaN;return (Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000+1}
function colIndex(ref){const letters=(String(ref).match(/^[A-Z]+/i)||[''])[0].toUpperCase();let n=0;for(const ch of letters)n=n*26+ch.charCodeAt(0)-64;return n-1}
function xmlDoc(text,label){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('This workbook contains invalid Excel XML in '+label+'.');return doc}
function elements(node,localName){return [...node.getElementsByTagNameNS('*',localName)]}
function normalizeZipPath(path){const parts=[];for(const part of path.replace(/\\/g,'/').split('/')){if(!part||part==='.')continue;if(part==='..')parts.pop();else parts.push(part)}return parts.join('/')}
function resolveWorkbookPath(target){if(target.startsWith('/'))return normalizeZipPath(target);return normalizeZipPath('xl/'+target)}
async function readZip(file){if(!window.JSZip)throw new Error('The offline Excel reader could not load. Reload the app once while online, then try again.');let zip;try{zip=await JSZip.loadAsync(await file.arrayBuffer())}catch(e){throw new Error('This file is not a readable Excel workbook. Please save it as .xlsx and upload again.')}return{async get(path){const entry=zip.file(path);return entry?await entry.async('string'):null}}}
function parseSharedStrings(xmlText){if(!xmlText)return[];const doc=xmlDoc(xmlText,'shared strings');return elements(doc,'si').map(si=>elements(si,'t').map(t=>t.textContent||'').join(''))}
function xmlSheetRows(xmlText,shared){const doc=xmlDoc(xmlText,'worksheet');const sheetData=elements(doc,'sheetData')[0];if(!sheetData)throw new Error('No worksheet data was found.');const out=[];for(const rowEl of elements(sheetData,'row')){const rowNo=Number(rowEl.getAttribute('r'))||out.length+1;const row=[];for(const c of elements(rowEl,'c')){const ref=c.getAttribute('r')||'';const ci=colIndex(ref);if(ci<0)continue;const type=c.getAttribute('t')||'';let value='';if(type==='inlineStr'){value=elements(c,'t').map(t=>t.textContent||'').join('')}else{const v=elements(c,'v')[0];const raw=v?v.textContent:'';if(type==='s'){const ix=Number(raw);value=Number.isInteger(ix)&&ix>=0?(shared[ix]??''):''}else if(type==='b')value=raw==='1';else if(type==='e')value='';else if(type==='str')value=raw;else if(raw!==''){const n=Number(raw);value=Number.isFinite(n)?n:raw}}row[ci]=value}while(row.length&&row[row.length-1]===undefined)row.pop();out[rowNo-1]=row}return out.map(r=>r||[])}
function headerCategory(v){const n=normalise(v);if(n==='dine in'||n==='dine')return'dine';if(n==='take away'||n==='takeaway'||n==='t away'||n==='t a')return'takeaway';if(n==='delivery')return'delivery';if(n==='aggregator'||n==='aggregators')return'aggregator';if(n==='total'||n==='grand total')return'total';return''}
function findReportTable(rows){let head=-1,outletCol=-1,starts={};for(let ri=0;ri<rows.length;ri++){const row=rows[ri]||[];const oi=row.findIndex(v=>normalise(v)==='outlet');const found={};row.forEach((v,ci)=>{const key=headerCategory(v);if(key&&!Number.isInteger(found[key]))found[key]=ci});if(oi>=0&&['dine','takeaway','delivery','aggregator','total'].every(k=>Number.isInteger(found[k]))){head=ri;outletCol=oi;starts=found;break}}
 if(head<0)throw new Error('Expected the outlet sales table was not found. The workbook needs Outlet, Dine In, Take Away, Delivery, Aggregator and Total columns.');
 const sub=rows[head+1]||[],order=['dine','takeaway','delivery','aggregator','total'],columns={};
 for(let i=0;i<order.length;i++){const k=order[i],start=starts[k],end=i+1<order.length?starts[order[i+1]]:Math.max(sub.length,start+2);let qty=-1,sales=-1;for(let c=start;c<end;c++){const n=normalise(sub[c]);if(qty<0&&/^(qty|quantity|count|docs|documents)$/.test(n))qty=c;if(sales<0&&/(net sales|sales amount|amount|value)/.test(n))sales=c}if(qty<0||sales<0){if(end-start>=2){qty=start;sales=start+1}else throw new Error('Could not match Qty and Net Sales columns for '+k+'.')}columns[k]={qty,sales}}
 const candidates=[];for(let r=head+2;r<rows.length;r++){const row=rows[r]||[],outlet=cleanText(row[outletCol]);if(!outlet||/^total$/i.test(outlet)||/^grand total$/i.test(outlet))continue;const v=order.map(k=>[toNumber(row[columns[k].qty]),toNumber(row[columns[k].sales])]);if(v.every(pair=>pair.every(Number.isFinite)))candidates.push({rowIndex:r,outlet,v})}
 if(!candidates.length)throw new Error('The sales table was found, but no complete outlet row could be read.');const exact=candidates.filter(c=>normalise(c.outlet)===OUTLET_TARGET);if(exact.length!==1)throw new Error(exact.length?'The workbook has duplicate Matara 2 rows. Please check the source report.':'The workbook does not contain one unique Matara 2 outlet row. No figures were displayed.');return{head,columns,selected:exact[0],outletCol,candidateCount:candidates.length}}
async function parseWorkbook(file){if(!/\.(xlsx|xlsm)$/i.test(file.name))throw new Error('Please choose an Excel workbook (.xlsx or .xlsm).');if(file.size>25*1024*1024)throw new Error('This workbook is larger than 25 MB. Save a smaller Excel copy and try again.');if(!file.size)throw new Error('This file is empty. Choose a valid Excel workbook.');const zip=await readZip(file);const workbookXml=await zip.get('xl/workbook.xml'),relsXml=await zip.get('xl/_rels/workbook.xml.rels');if(!workbookXml||!relsXml)throw new Error('Excel workbook metadata is missing. Save the report as .xlsx and upload again.');const wbDoc=xmlDoc(workbookXml,'workbook'),relDoc=xmlDoc(relsXml,'workbook relationships');const relMap=new Map(elements(relDoc,'Relationship').map(r=>[r.getAttribute('Id'),r.getAttribute('Target')]));const sheets=elements(wbDoc,'sheet');if(!sheets.length)throw new Error('No worksheet was found in this workbook.');const shared=parseSharedStrings(await zip.get('xl/sharedStrings.xml'));let parsed=null,parseError=null;for(const sh of sheets){const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id')||sh.getAttribute('id');const target=relMap.get(rid);if(!target)continue;const xml=await zip.get(resolveWorkbookPath(target));if(!xml)continue;try{const rows=xmlSheetRows(xml,shared),table=findReportTable(rows),dates=parseDateRange(rows);if(!dates.from||!dates.to)throw new Error('The report table was found, but its From Date / To Date could not be read.');parsed={table,dates,sheet:sh.getAttribute('name')||'Worksheet'};break}catch(err){parseError=err}}
 if(!parsed)throw parseError||new Error('No worksheet contains the expected outlet sales table.');const picked=parsed.table.selected,values=picked.v.map(([q,s])=>[q,s]);for(let k=0;k<values.length;k++){if(!Number.isInteger(values[k][0])||values[k][0]<0)throw new Error(`${CHANNELS[k].label} quantity is missing or invalid.`);if(!Number.isFinite(values[k][1])||values[k][1]<0)throw new Error(`${CHANNELS[k].label} net sales are missing or invalid.`)}return{fileName:file.name,sheet:parsed.sheet,outlet:picked.outlet,from:parsed.dates.from,to:parsed.dates.to,values,rowIndex:picked.rowIndex+1,candidateCount:parsed.table.candidateCount}}

function cents(n){return Math.round((n+Number.EPSILON)*100)}
const MAX_SALES_DELTA_CENTS=500;
function reportSalesDeltaCents(report){const channelCents=report.values.slice(0,4).reduce((sum,v)=>sum+cents(v[1]),0);return channelCents-cents(report.values[4][1])}
function validateReports(){
 const [daily,mtd]=state.reports,errors=[],warnings=[];
 if(!daily||!mtd)return{ok:false,errors:['Upload both reports to begin validation.'],warnings:[]};
 if(daily.from!==daily.to)errors.push('The Daily report must cover exactly one date.');
 if(!mtd.from||mtd.from.slice(8,10)!=='01')errors.push('The MTD report must start on the first day of the month.');
 if(daily.to!==mtd.to)errors.push('The Daily report date must match the MTD report end date.');
 if(daily.to&&mtd.from&&daily.to<mtd.from)errors.push('The Daily report date falls outside the MTD period.');
 if(normalise(daily.outlet)!==normalise(mtd.outlet))errors.push('The two reports do not refer to the same outlet.');
 const numbersValid=report=>Array.isArray(report.values)&&report.values.length===5&&report.values.every(([qty,sales])=>Number.isFinite(qty)&&qty>=0&&Number.isInteger(qty)&&Number.isFinite(sales)&&sales>=0);
 if(!numbersValid(daily)||!numbersValid(mtd))errors.push('A required document count or sales value is missing or invalid.');
 if(numbersValid(daily)&&numbersValid(mtd)){
  for(const [name,report] of [['Daily',daily],['MTD',mtd]]){
   const sumQty=report.values.slice(0,4).reduce((sum,value)=>sum+value[0],0);
   if(sumQty!==report.values[4][0])errors.push(`${name} channel document counts do not exactly equal the Total document count.`);
   const salesDelta=reportSalesDeltaCents(report);
   if(Math.abs(salesDelta)>MAX_SALES_DELTA_CENTS){errors.push(`${name} report: channel sales do not add up to the Total (difference Rs. ${money(Math.abs(salesDelta)/100)}).`)}
   else if(salesDelta!==0){warnings.push(`${name} channel net sales differ from the source Total by Rs. ${money(Math.abs(salesDelta)/100)}; accepted within the Rs. 5.00 tolerance.`)}
  }
  for(let i=0;i<5;i++){
   if(mtd.values[i][0]<daily.values[i][0])errors.push(`${DISPLAY_ROWS[i].label} MTD document count is lower than the Daily count.`);
   if(cents(mtd.values[i][1])<cents(daily.values[i][1]))errors.push(`${DISPLAY_ROWS[i].label} MTD sales are lower than the Daily sales.`);
  }
 }
 if(!Number.isFinite(dayCount(mtd.from,mtd.to))||dayCount(mtd.from,mtd.to)<1)errors.push('The MTD date range is invalid.');
 return errors.length?{ok:false,errors:[...new Set(errors)],warnings:[...new Set(warnings)]}:{ok:true,errors:[],warnings:[...new Set(warnings)]};
}
function money(value){return Number.isFinite(value)?value.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function integer(value){return Number.isFinite(value)?Math.round(value).toLocaleString('en-US'):'—'}
function decimal(value){return Number.isFinite(value)?value.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function metricValue(metricId,index){
 const daily=state.reports[0],mtd=state.reports[1],days=dayCount(mtd.from,mtd.to),d=daily.values[index],m=mtd.values[index];
 switch(metricId){
  case 'noDoc':return d[0];
  case 'netSales':return d[1];
  case 'cumulativeSales':return m[1];
  case 'avgChannel':return m[1]/days;
  case 'cumDoc':return m[0];
  case 'avgDoc':return m[0]/days;
  case 'docAvg':return m[0]===0?null:m[1]/m[0];
  default:return null;
 }
}
function formatMetric(value,kind){if(value===null||!Number.isFinite(value))return'—';if(kind==='integer')return integer(value);if(kind==='decimal')return decimal(value);return money(value)}
function dateFormat(s,options={day:'2-digit',month:'short',year:'numeric'}){const d=dateObj(s);return d?d.toLocaleDateString('en-GB',{...options,timeZone:'UTC'}):'Date unavailable'}
const METRICS=[['noDoc','No. Doc'],['netSales','Net Sales'],['cumulativeSales','Cumulative Sales'],['avgChannel','Avg. Channel'],['cumDoc','Cum. Doc'],['avgDoc','Avg. Doc'],['docAvg','Doc Avg.']];
const state={reports:[null,null],errors:[],busy:false};   // reports[0] = Daily, reports[1] = MTD
const whole=n=>Number.isFinite(n)?Math.round(n).toLocaleString('en-US'):'0';
function render(){
  const[d,m]=state.reports,res=d&&m?validateReports():null,ok=!!(res&&res.ok);
  $('#pick').hidden=ok;$('#out').hidden=!ok;
  const msgs=[...state.errors,...(res&&!res.ok?res.errors:[])];
  $('#msg').hidden=!msgs.length;$('#msg').innerHTML=msgs.map(x=>`<p>${escapeHTML(x)}</p>`).join('');
  $('#chips').innerHTML=[['Daily',d],['MTD',m]].filter(x=>x[1]).map(([n,r])=>`<li>✓ ${n} report<span>${escapeHTML(r.fileName)}</span></li>`).join('');
  $('#bigText').textContent=state.busy?'Reading…':!d&&!m?'Choose Daily + MTD reports':!d?'Add the Daily report':!m?'Add the MTD report':'Choose reports again';
  $('#big').classList.toggle('busy',state.busy);
  if(!ok)return;
  const days=dayCount(m.from,m.to);
  $('#whenDay').textContent='Daily · '+dateFormat(d.to,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('#whenMtd').textContent='MTD · '+dateFormat(m.from,{day:'numeric',month:'short'})+' – '+dateFormat(m.to,{day:'numeric',month:'short'})+' · '+days+' days';
  $('#cards').innerHTML=METRICS.map(([k,l])=>`<article class="card"><h2>${l}</h2><dl>${DISPLAY_ROWS.map((r,i)=>`<div class="${i===4?'tot':''}"><dt>${r.label}</dt><dd>${whole(metricValue(k,r.sourceIndex))}</dd></div>`).join('')}</dl></article>`).join('');
  scrollTo(0,0);
}
async function addFiles(list){
  const files=[...list].slice(0,4);if(!files.length)return;
  state.errors=[];state.busy=true;render();
  const res=await Promise.allSettled(files.map(parseWorkbook)),got=[];
  res.forEach((r,i)=>{if(r.status==='fulfilled')got.push(r.value);else state.errors.push(files[i].name+': '+(r.reason&&r.reason.message||'Could not read this file'))});
  const type=x=>x.from===x.to?0:1;let t=got.map(type);
  if(got.length===2&&t[0]===0&&t[1]===0&&got.every(x=>x.from.slice(8)==='01'))t=[0,1];   // first day of month: both reports cover the same date
  const used=new Set();got.forEach((x,i)=>{if(used.has(t[i])){state.errors.push('Choose one Daily report and one MTD report.');return}used.add(t[i]);state.reports[t[i]]=x});
  state.busy=false;render();
}
$('#files').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';addFiles(f)});
const pick=$('#pick');pick.addEventListener('dragover',e=>{e.preventDefault();pick.classList.add('drag')});pick.addEventListener('dragleave',()=>pick.classList.remove('drag'));pick.addEventListener('drop',e=>{e.preventDefault();pick.classList.remove('drag');addFiles(e.dataTransfer.files)});
$('#reset').addEventListener('click',()=>{state.reports=[null,null];state.errors=[];render()});
render();
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
